<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Будничный футбол</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090c10;--card:#11161d;--card2:#171d25;--line:#27303b;--text:#f4f6f8;--muted:#8e99a8;--accent:#ff8a1f;--good:#42c879;--danger:#ff5c5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#0b0e12ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900}.nav{display:flex;gap:5px;overflow:auto}.nav button,.tab{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}.nav button.active,.nav button:hover,.tab.active{background:var(--card2);color:#fff}.wrap{max-width:1180px;margin:auto;padding:30px 18px 80px}.page{display:none}.page.active{display:block}.hero{border:1px solid var(--line);background:linear-gradient(135deg,#151b23,#0f1319);border-radius:18px;padding:28px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--accent)}h1{font-size:40px;line-height:1.05;margin:7px 0}h2{font-size:30px;margin:5px 0 18px}h3{margin:0 0 10px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card2);color:#fff;padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:700}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}.btn.danger{background:#32171b;color:#ff9a9a}.days{display:grid;gap:14px}.day-card{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:20px;cursor:pointer}.day-head{display:flex;justify-content:space-between;gap:15px}.date{font-size:24px;font-weight:900}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.team-pill{background:var(--card2);border-radius:10px;padding:11px;border-left:5px solid var(--team)}.team-pill b{display:block}.stats-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.stats-table th,.stats-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.stats-table th{font-size:12px;color:var(--muted)}.stats-table tr:last-child td{border-bottom:0}.player-table-row{cursor:pointer}.player-table-row:hover{background:var(--card2)}.players-table th,.players-table td{white-space:nowrap}.team-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--team);margin-right:7px}.modal{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:18px}.modal.hidden{display:none}.modalbox{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:23px;position:relative}.close{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:27px;cursor:pointer}.day-detail{display:grid;gap:20px}.team-board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team-board>div{background:var(--card2);border-radius:11px;padding:14px;border-top:5px solid var(--team)}.form{display:grid;gap:15px;background:var(--card);border:1px solid var(--line);padding:22px;border-radius:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%;background:#0c1015;border:1px solid var(--line);color:#fff;padding:11px;border-radius:8px}.team-editor{border:1px solid var(--line);border-radius:12px;padding:15px;background:#0e1319}.team-editor-head{display:grid;grid-template-columns:1fr 70px 40px;gap:8px}.color{height:42px;padding:3px!important}.players-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.player-check{background:var(--card2);padding:9px;border-radius:7px}.player-check input{width:auto!important}.games-editor{display:grid;gap:9px}.game-row{display:grid;grid-template-columns:1fr 60px 60px 1fr 40px;gap:7px;align-items:center}.login{max-width:460px;margin:30px auto}.note{font-size:13px;color:var(--muted)}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:15px}@media(max-width:800px){.hero{display:block}.teams,.team-board{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.players-list{grid-template-columns:1fr 1fr}.game-row{grid-template-columns:1fr 50px 50px 1fr 36px}}@media(max-width:500px){.top{display:block}.brand{margin-bottom:10px}.teams,.team-board,.players-list{grid-template-columns:1fr}.stats-table{font-size:12px}.stats-table th,.stats-table td{padding:9px 6px}h1{font-size:33px}}
</style>
<style>
.stats-help{display:flex;gap:12px;flex-wrap:wrap;background:#0b1016;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 12px;color:#c8d0da;font-size:13px}.stats-help.big{display:grid;grid-template-columns:1.4fr 1fr .6fr .6fr .8fr .6fr;gap:7px;border-radius:8px}.player-stats-line{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;color:#dfe5ec}.section-block{border:1px solid var(--line);background:#0e1319;border-radius:13px;padding:15px}.save-panel{position:sticky;bottom:8px;z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#111820ee;border:1px solid var(--line);padding:12px;border-radius:12px;backdrop-filter:blur(8px)}.save-panel span{font-size:12px;color:var(--muted)}.game-head{display:grid;grid-template-columns:1fr 60px 60px 1fr 40px;gap:7px;color:var(--muted);font-size:11px;padding:0 0 5px}.player-edit-row{display:grid;grid-template-columns:1.4fr 1fr .6fr .6fr .8fr .6fr;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}.player-edit-row input,.player-edit-row select,.game-row select,.game-row input{width:100%;background:#0c1015;border:1px solid var(--line);color:#fff;padding:9px;border-radius:7px} .stat-input{display:grid;gap:4px;color:var(--muted);font-size:10px}.stat-input input{width:100%}.gp-box{display:grid;gap:4px;align-content:center;background:#0b1016;border:1px solid var(--line);border-radius:7px;padding:7px;color:#fff}.gp-box span{font-size:10px;color:var(--muted)}.edit-day-form{gap:12px}.edit-day-form h3{margin-top:2px}@media(max-width:800px){.stats-help.big,.player-edit-row{grid-template-columns:1fr 1fr}.game-head{display:none}.edit-game-row{grid-template-columns:1fr 55px 55px 1fr 38px}.save-panel{position:static}}@media(max-width:500px){.player-edit-row{grid-template-columns:1fr 1fr}.player-edit-row b{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><div class="brand">⚽ БУДНИЧНЫЙ ФУТБОЛ</div><nav class="nav"><button class="active" data-page="days">Игровые дни</button><button data-page="players">Игроки</button><button data-page="admin">Админка</button></nav></header>
<main class="wrap">
<section id="days" class="page active"><div class="hero"><div><div class="eyebrow">ИГРОВЫЕ ДНИ</div><h1>Будничный футбол</h1><p class="muted">Каждый день — свои команды, игры и статистика.</p></div><button class="btn primary" onclick="go('admin')">+ Новый игровой день</button></div><div id="daysList" class="days"></div></section>
<section id="players" class="page"><div class="toolbar"><div><div class="eyebrow">ИГРОКИ</div><h2>Игроки</h2><p class="muted">Здесь собран общий рейтинг. Нажми на карточку игрока, чтобы открыть его профиль и историю выступлений.</p></div></div><div class="tabs player-sort-tabs"><button class="tab active" data-player-sort="gp">Г+П</button><button class="tab" data-player-sort="goals">Забил</button><button class="tab" data-player-sort="assists">Пас</button><button class="tab" data-player-sort="rating">Рейтинг</button><button class="tab" data-player-sort="days">Игровые дни</button></div><div id="playersBox"></div></section>
<section id="admin" class="page"><div id="adminContent"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const SUPABASE_URL='https://hucunqgqsspwjcvozzll.supabase.co';
const SUPABASE_KEY='sb_publishable_-jsjEBT9IFPmUriZ7LDceg_lHAV-rVX';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let players=[],days=[],teams=[],games=[],dayPlayers=[],currentSort='gp',editTeams=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function go(id){$$('.page').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id)); if(id==='days')loadDays();if(id==='players'){Promise.all([loadPlayers(),loadDays()]);}if(id==='admin')renderAdmin();}
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
async function loadPlayers(){let r=await sb.from('players').select('*').order('name');if(r.error){showError(r.error);return}players=r.data||[];renderPlayers()}
async function loadDays(){let [d,t,g,p]=await Promise.all([sb.from('game_days').select('*').order('game_date',{ascending:false}),sb.from('teams').select('*').order('sort_order'),sb.from('games').select('*').order('game_order'),sb.from('game_day_players').select('*')]);if(d.error||t.error||g.error||p.error){showError(d.error||t.error||g.error||p.error);return}days=d.data||[];teams=t.data||[];games=g.data||[];dayPlayers=p.data||[];renderDays()}
function dayName(date){return new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long'}).replace(/^./,x=>x.toUpperCase())}
function fmtDate(date){return new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}
function renderDays(){let box=$('#daysList');if(!days.length){box.innerHTML='<div class="day-card"><b>Пока нет игровых дней.</b><p class="muted">Создай первый день в админке.</p></div>';return}box.innerHTML=days.map(d=>{let ts=teams.filter(t=>t.game_day_id===d.id),gs=games.filter(g=>g.game_day_id===d.id),ps=dayPlayers.filter(p=>p.game_day_id===d.id);return `<article class="day-card" onclick="openDay(${d.id})"><div class="day-head"><div><div class="eyebrow">${esc(dayName(d.game_date))}</div><div class="date">${esc(fmtDate(d.game_date))} · ${esc(d.place||'')}</div></div><div class="muted">${esc(d.game_time||'')} · ${ts.length} команд · ${ps.length} участников</div></div><div class="teams">${ts.map(t=>{let w=0,l=0;gs.forEach(g=>{if(g.team_a_id===t.id){w+=g.score_a>g.score_b?1:0;l+=g.score_a<g.score_b?1:0}if(g.team_b_id===t.id){w+=g.score_b>g.score_a?1:0;l+=g.score_b<g.score_a?1:0}});return `<div class="team-pill" style="--team:${esc(t.color)}"><b><span class="team-dot" style="--team:${esc(t.color)}"></span>${esc(t.name)}</b><span class="muted">${w} побед · ${l} поражений</span></div>`}).join('')}</div></article>`}).join('')}
async function openDay(id){let d=days.find(x=>x.id===id),ts=teams.filter(t=>t.game_day_id===id),gs=games.filter(g=>g.game_day_id===id),ps=dayPlayers.filter(p=>p.game_day_id===id);let rows=ps.map(x=>{let p=players.find(p=>p.id===x.player_id),t=ts.find(t=>t.id===x.team_id);return {...x,p,t}}).sort((a,b)=>(b.goals+b.assists)-(a.goals+a.assists));let session=(await sb.auth.getSession()).data.session;let adminGames=session?`<button type="button" class="btn danger" data-del-saved-game="__ID__">Удалить игру</button>`:'';let gamesHtml=gs.length?gs.map((g,i)=>{let a=ts.find(t=>t.id===g.team_a_id),b=ts.find(t=>t.id===g.team_b_id);return `<div class="day-card" style="cursor:default;padding:12px;margin:7px 0"><span style="color:${esc(a.color)}">${esc(a.name)}</span> <b>${g.score_a} : ${g.score_b}</b> <span style="color:${esc(b.color)}">${esc(b.name)}</span>${session?` <button type="button" class="btn danger" style="float:right" data-del-saved-game="${g.id}">Удалить</button>`:''}</div>`}).join(''):'<span class="muted">Игры ещё не добавлены.</span>';$('#modalContent').innerHTML=`<div class="day-detail"><div><div class="eyebrow">${esc(dayName(d.game_date))}</div><h2>${esc(fmtDate(d.game_date))} · ${esc(d.place||'')}</h2><div class="muted">${esc(d.game_time||'')}</div></div><div><h3>Команды</h3><div class="team-board">${ts.map(t=>{let w=0,l=0;gs.forEach(g=>{let a=t.id===g.team_a_id,b=t.id===g.team_b_id;if(a){w+=g.score_a>g.score_b?1:0;l+=g.score_a<g.score_b?1:0}if(b){w+=g.score_b>g.score_a?1:0;l+=g.score_b<g.score_a?1:0}});return `<div style="--team:${esc(t.color)}"><b>${esc(t.name)}</b><div>${w} побед · ${l} поражений</div></div>`}).join('')}</div></div><div><h3>Игры</h3>${gamesHtml}</div><div><h3>Участники</h3><div style="overflow:auto"><table class="stats-table"><thead><tr><th>Игрок</th><th>Команда</th><th>Забил</th><th>Пас</th><th>Г+П</th><th>Пропустил</th><th>⭐</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.p?.name||'')}</b></td><td><span class="team-dot" style="--team:${esc(x.t?.color||'#fff')}"></span>${esc(x.t?.name||'')}</td><td>${x.goals}</td><td>${x.assists}</td><td><b>${x.goals+x.assists}</b></td><td>${x.conceded}</td><td>${x.rating??'—'}</td></tr>`).join('')}</tbody></table></div></div></div>`;$('#modal').classList.remove('hidden');$$('[data-del-saved-game]').forEach(b=>b.onclick=()=>deleteSavedGame(+b.dataset.delSavedGame));}
async function deleteSavedGame(id){let g=games.find(x=>x.id===id);if(!g)return;if(!confirm('Удалить эту игру?'))return;let r=await sb.from('games').delete().eq('id',id);if(r.error){showError(r.error);return}games=games.filter(x=>x.id!==id);closeModal();renderDays();alert('Игра удалена.')}function closeModal(){$('#modal').classList.add('hidden')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function renderPlayers(){let totals=players.map(p=>{let a=dayPlayers.filter(x=>x.player_id===p.id);return {p,g:a.reduce((s,x)=>s+x.goals,0),c:a.reduce((s,x)=>s+x.conceded,0),a:a.reduce((s,x)=>s+x.assists,0),d:new Set(a.map(x=>x.game_day_id)).size}});$('#playersBox').innerHTML=`<div class="players-list">${totals.map(x=>`<div class="day-card" style="cursor:pointer" onclick="openPlayer(${x.p.id})"><h3>${esc(x.p.name)}</h3><div class="muted">${esc(x.p.position||'Игрок')}</div><p>⚽ ${x.g} · 🥅 ${x.c} · 🎯 ${x.a}</p><b>Г+П ${x.g+x.a}</b></div>`).join('')}</div>`}
function openPlayer(id){let p=players.find(x=>x.id===id),a=dayPlayers.filter(x=>x.player_id===id);$('#modalContent').innerHTML=`<div class="eyebrow">ИГРОК</div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.position||'')}</p><table class="stats-table"><thead><tr><th>Игровых дней</th><th>Забил</th><th>Пропустил</th><th>Пас</th><th>Г+П</th></tr></thead><tbody><tr><td>${new Set(a.map(x=>x.game_day_id)).size}</td><td>${a.reduce((s,x)=>s+x.goals,0)}</td><td>${a.reduce((s,x)=>s+x.conceded,0)}</td><td>${a.reduce((s,x)=>s+x.assists,0)}</td><td><b>${a.reduce((s,x)=>s+x.goals+x.assists,0)}</b></td></tr></tbody></table>`;$('#modal').classList.remove('hidden')}
async function loadRating(){await Promise.all([loadPlayers(),loadDays()]);renderRating()}
function renderRating(){let arr=players.map(p=>{let a=dayPlayers.filter(x=>x.player_id===p.id);let s={days:new Set(a.map(x=>x.game_day_id)).size,goals:a.reduce((z,x)=>z+x.goals,0),conceded:a.reduce((z,x)=>z+x.conceded,0),assists:a.reduce((z,x)=>z+x.assists,0)};s.gp=s.goals+s.assists;return {p,s}}).sort((a,b)=>b.s[currentSort]-a.s[currentSort]);$('#ratingBox').innerHTML=`<table class="stats-table"><thead><tr><th>#</th><th>Игрок</th><th>Дни</th><th>Забил</th><th>Пропустил</th><th>Пас</th><th>Г+П</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.p.name)}</b></td><td>${x.s.days}</td><td>${x.s.goals}</td><td>${x.s.conceded}</td><td>${x.s.assists}</td><td><b>${x.s.gp}</b></td></tr>`).join('')}</tbody></table>`}
async function renderAdmin(){let {data}=await sb.from('players').select('*').order('name');players=data||[];$('#adminContent').innerHTML=`<div class="eyebrow">УПРАВЛЕНИЕ</div><h2>Админка</h2><div id="loginBox"></div><div id="adminPanel" class="hidden"><div class="form"><h3>Игроки</h3><div class="grid"><div class="field"><label>Имя игрока</label><input id="newPlayerName" placeholder="Иван Иванов"></div><div class="field"><label>Позиция</label><input id="newPlayerPosition" placeholder="Защитник"></div></div><button type="button" class="btn primary" id="addPlayer">+ Добавить игрока</button><div id="adminPlayersList"></div></div><form id="dayForm" class="form"><h3>Новый игровой день</h3><div class="grid"><div class="field"><label>Дата</label><input id="date" type="date" required></div><div class="field"><label>Время</label><input id="time" type="time"></div><div class="field"><label>Место</label><input id="place" placeholder="Металлург"></div><div class="field"><label>Количество команд</label><select id="teamCount"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div></div><div><h3>Команды</h3><div id="teamEditors"></div></div><div><h3>Игры</h3><div id="gameEditors" class="games-editor"></div><button type="button" class="btn" id="addGame">+ Добавить игру</button></div><div><h3>Участники</h3><div id="participantEditors"></div></div><button class="btn primary">Сохранить игровой день</button></form></div>`;$('#date').value=new Date().toISOString().slice(0,10);let session=(await sb.auth.getSession()).data.session;if(session){$('#loginBox').innerHTML=`<p class="muted">Вы вошли как ${esc(session.user.email)}</p><button type="button" class="btn" id="logout">Выйти</button>`;$('#adminPanel').classList.remove('hidden');$('#logout').onclick=async()=>{await sb.auth.signOut();renderAdmin()};renderAdminPlayers();$('#addPlayer').onclick=addPlayer;}else{renderLogin();}$('#teamCount').onchange=renderTeamEditors;renderTeamEditors();$('#addGame').onclick=()=>{editGames.push({a:'',b:'',sa:0,sb:0});renderGameEditors()};$('#dayForm').onsubmit=saveDay}

function renderAdminPlayers(){let box=$('#adminPlayersList');if(!players.length){box.innerHTML='<p class="note">Игроков пока нет.</p>';return}box.innerHTML=`<div class="players-list">${players.map(p=>`<div class="player-check"><input class="player-edit-name" data-edit-player="${p.id}" value="${esc(p.name)}"><input class="player-edit-position" data-edit-position="${p.id}" value="${esc(p.position||'')}" placeholder="Позиция"><div style="display:flex;gap:7px;margin-top:7px;flex-wrap:wrap"><button type="button" class="btn" data-save-player="${p.id}">Сохранить</button><button type="button" class="btn danger" data-del-player="${p.id}">🗑️ Удалить игрока и статистику</button></div></div>`).join('')}</div>`;$$('[data-del-player]').forEach(b=>b.onclick=()=>deletePlayer(+b.dataset.delPlayer));$$('[data-save-player]').forEach(b=>b.onclick=()=>updatePlayer(+b.dataset.savePlayer));}

async function addPlayer(){let name=$('#newPlayerName').value.trim(),position=$('#newPlayerPosition').value.trim();if(!name)return alert('Введите имя игрока.');let r=await sb.from('players').insert({name,position:position||null}).select().single();if(r.error){showError(r.error);return}players.push(r.data);players.sort((a,b)=>a.name.localeCompare(b.name,'ru'));$('#newPlayerName').value='';$('#newPlayerPosition').value='';renderAdminPlayers();renderTeamEditors();}

async function updatePlayer(id){let name=$(`[data-edit-player="${id}"]`).value.trim(),position=$(`[data-edit-position="${id}"]`).value.trim();if(!name)return alert('Имя игрока не может быть пустым.');let r=await sb.from('players').update({name,position:position||null}).eq('id',id).select().single();if(r.error){showError(r.error);return}let i=players.findIndex(x=>x.id===id);if(i>=0)players[i]=r.data;players.sort((a,b)=>a.name.localeCompare(b.name,'ru'));renderAdminPlayers();renderTeamEditors();}

async function deletePlayer(id){let p=players.find(x=>x.id===id);if(!p)return;if(!confirm('Удалить игрока '+p.name+'? Если у него есть статистика, Supabase может не разрешить удаление.'))return;let r=await sb.from('players').delete().eq('id',id);if(r.error){showError(r.error);return}players=players.filter(x=>x.id!==id);dayPlayers=dayPlayers.filter(x=>x.player_id!==id);renderAdminPlayers();renderTeamEditors();renderPlayers();renderRating();}

async function addPlayer(){
  const name=$('#newPlayerName').value.trim(), position=$('#newPlayerPosition').value.trim();
  if(!name)return alert('Введите имя игрока.');
  const r=await sb.from('players').insert({name,position:position||null}).select().single();
  if(r.error){showError(r.error);return;}
  $('#newPlayerName').value=''; $('#newPlayerPosition').value='';
  await loadPlayers();
  renderAdminPlayers();
  if($('#teamEditors')) renderTeamEditors();
  alert('Игрок добавлен. Он уже появился в разделе «Игроки».');
}

async function deletePlayer(id){
  const p=players.find(x=>x.id===id); if(!p)return;
  if(!confirm('Удалить игрока «'+p.name+'»? Его статистика тоже будет удалена.'))return;
  const r1=await sb.from('game_day_players').delete().eq('player_id',id);
  if(r1.error){showError(r1.error);return;}
  const r2=await sb.from('players').delete().eq('id',id);
  if(r2.error){showError(r2.error);return;}
  await loadPlayers(); await loadDays(); renderAdminPlayers();
  if($('#teamEditors')) renderTeamEditors();
  alert('Игрок удалён.');
}

async function updatePlayer(id){
  const name=$(`[data-edit-player="${id}"]`).value.trim();
  const position=$(`[data-edit-position="${id}"]`).value.trim();
  if(!name)return alert('Имя игрока не может быть пустым.');

async function deleteGameDay(id){

  if(!confirm('Удалить игровой день '+fmtDate(d.game_date)+'?\nБудут удалены его команды, игры и статистика участников.'))return;
  // Удаляем связанные записи по порядку, чтобы удаление не зависело от ON DELETE CASCADE.

function updateGP(playerId){
  const goals=+($(`[data-ep-goals="${playerId}"]`)?.value||0);
  const assists=+($(`[data-ep-assists="${playerId}"]`)?.value||0);
  const out=$(`[data-ep-gp="${playerId}"]`); if(out)out.textContent=goals+assists;
}

async function saveEditDay(){
  const id=editDayId; if(!id)return;
  if(editDayGames.some(g=>!g.team_a_id||!g.team_b_id||g.team_a_id===g.team_b_id))return alert('В каждой игре должны быть две разные команды.');
  const r0=await sb.from('game_days').update({game_date:$('#ed-date').value,game_time:$('#ed-time').value||null,place:$('#ed-place').value||null}).eq('id',id);
  if(r0.error){showError(r0.error);return;}
  for(const t of editDayTeams){const r=await sb.from('teams').update({name:t.name,color:t.color}).eq('id',t.id);if(r.error){showError(r.error);return;}}
  const r1=await sb.from('games').delete().eq('game_day_id',id); if(r1.error){showError(r1.error);return;}
  if(editDayGames.length){const rows=editDayGames.map((g,i)=>({game_day_id:id,team_a_id:g.team_a_id,team_b_id:g.team_b_id,score_a:Math.max(0,+g.score_a||0),score_b:Math.max(0,+g.score_b||0),game_order:i+1}));const r=await sb.from('games').insert(rows);if(r.error){showError(r.error);return;}}
  const r2=await sb.from('game_day_players').delete().eq('game_day_id',id);if(r2.error){showError(r2.error);return;}
  const rows=[];
  for(const p of players){const sel=$(`[data-ep-team="${p.id}"]`)?.value;if(!sel)continue;let rating=$(`[data-ep-rating="${p.id}"]`)?.value;rows.push({game_day_id:id,player_id:p.id,team_id:+sel,goals:Math.max(0,+($(`[data-ep-goals="${p.id}"]`)?.value||0)),conceded:Math.max(0,+($(`[data-ep-conceded="${p.id}"]`)?.value||0)),assists:Math.max(0,+($(`[data-ep-assists="${p.id}"]`)?.value||0)),rating:rating===''||rating==null?null:Math.min(10,Math.max(0,+rating))});}
  if(rows.length){const r3=await sb.from('game_day_players').insert(rows);if(r3.error){showError(r3.error);return;}}
  await loadPlayers(); await loadDays(); alert('Изменения сохранены.'); openDay(id);
}

  $('#adminContent').innerHTML=`<div class="eyebrow">УПРАВЛЕНИЕ</div><h2>Админка</h2><div id="loginBox"></div><div id="adminPanel" class="hidden">
    <div class="form"><h3>Игроки</h3><div class="grid"><div class="field"><label>Имя игрока</label><input id="newPlayerName" placeholder="Иван Иванов"></div><div class="field"><label>Позиция</label><input id="newPlayerPosition" placeholder="Защитник"></div></div><button type="button" class="btn primary" id="addPlayer">+ Добавить игрока</button><div id="adminPlayersList"></div></div>
    <div class="form"><h3>Игровые дни</h3><div id="adminDaysList"></div></div>
    <form id="dayForm" class="form"><h3>Новый игровой день</h3><div class="grid"><div class="field"><label>Дата</label><input id="date" type="date" required></div><div class="field"><label>Время</label><input id="time" type="time"></div><div class="field"><label>Место</label><input id="place" placeholder="Металлург"></div><div class="field"><label>Количество команд</label><select id="teamCount"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div></div><div><h3>Команды</h3><div id="teamEditors"></div></div><div><h3>Игры</h3><div id="gameEditors" class="games-editor"></div><button type="button" class="btn" id="addGame">+ Добавить игру</button></div><div><h3>Участники</h3><div id="participantEditors"></div></div><button class="btn primary">Сохранить игровой день</button></form>
  </div>`;
  $('#date').value=new Date().toISOString().slice(0,10);
  const session=(await sb.auth.getSession()).data.session;
  if(session){
    $('#loginBox').innerHTML=`<p class="muted">Вы вошли как ${esc(session.user.email)}</p><button type="button" class="btn" id="logout">Выйти</button>`;
    $('#adminPanel').classList.remove('hidden'); $('#logout').onclick=async()=>{await sb.auth.signOut();renderAdmin()};
    renderAdminPlayers(); $('#addPlayer').onclick=addPlayer; renderAdminDays();
    $('#teamCount').onchange=()=>{editTeams=[];renderTeamEditors()}; renderTeamEditors();
    $('#addGame').onclick=()=>{editGames.push({a:0,b:1,sa:0,sb:0});renderGameEditors()}; $('#dayForm').onsubmit=saveDay;
  }else renderLogin();
}

function renderAdminDays(){
  const box=$('#adminDaysList'); if(!box)return;
  if(!days.length){box.innerHTML='<p class="note">Игровых дней пока нет.</p>';return;}
  box.innerHTML=days.map(d=>{const ts=teams.filter(t=>t.game_day_id===d.id),gs=games.filter(g=>g.game_day_id===d.id),ps=dayPlayers.filter(p=>p.game_day_id===d.id);return `<div class="day-card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><div><b>${esc(fmtDate(d.game_date))} · ${esc(d.place||'Без места')}</b><div class="muted">${esc(d.game_time||'')} · ${ts.length} команд · ${gs.length} игр · ${ps.length} участников</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button type="button" class="btn primary" data-admin-edit-day="${d.id}">✏️ Редактировать</button><button type="button" class="btn danger" data-admin-del-day="${d.id}">🗑️ Удалить</button></div></div></div>`}).join('');
  $$('[data-admin-edit-day]').forEach(b=>b.onclick=()=>openEditDay(+b.dataset.adminEditDay));
  $$('[data-admin-del-day]').forEach(b=>b.onclick=()=>deleteGameDay(+b.dataset.adminDelDay));
}


/* === ФИНАЛЬНЫЕ ИСПРАВЛЕНИЯ АДМИНКИ === */
function statsLabels(){return '<div class="stats-help"><span>⚽ Голы</span><span>🎯 Пасы</span><span>🥅 Пропустил</span><span>⭐ Рейтинг</span></div>'}

function playerTotals(p){const a=dayPlayers.filter(x=>x.player_id===p.id);const rated=a.filter(x=>x.rating!=null);const goals=a.reduce((s,x)=>s+(+x.goals||0),0),assists=a.reduce((s,x)=>s+(+x.assists||0),0),conceded=a.reduce((s,x)=>s+(+x.conceded||0),0);return {p,goals,assists,gp:goals+assists,conceded,days:new Set(a.map(x=>x.game_day_id)).size,rating:rated.length?Math.round(rated.reduce((s,x)=>s+(+x.rating||0),0)/rated.length*10)/10:null};}
function renderPlayers(){const totals=players.map(playerTotals).sort((a,b)=>{const av=a[currentPlayerSort]??0,bv=b[currentPlayerSort]??0;return bv-av||a.p.name.localeCompare(b.p.name,'ru')});$('#playersBox').innerHTML=totals.length?`<div style="overflow:auto"><table class="stats-table players-table"><thead><tr><th>№</th><th>Игрок</th><th>Позиция</th><th>Игровые дни</th><th>⚽ Забил</th><th>🎯 Пас</th><th><b>Г+П</b></th><th>🥅 Пропустил</th><th>⭐ Рейтинг</th></tr></thead><tbody>${totals.map((x,i)=>`<tr class="player-table-row" onclick="openPlayer(${x.p.id})" title="Открыть профиль игрока"><td>${i+1}</td><td><b>${esc(x.p.name)}</b></td><td>${esc(x.p.position||'Игрок')}</td><td>${x.days}</td><td>${x.goals}</td><td>${x.assists}</td><td><b>${x.gp}</b></td><td>${x.conceded}</td><td>${x.rating??'—'}</td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:8px">Нажми на строку игрока, чтобы открыть его профиль и историю выступлений.</div>`:'<div class="day-card"><b>Игроков пока нет.</b></div>'; }
function openPlayer(id){const p=players.find(x=>x.id===id);if(!p)return;const a=dayPlayers.filter(x=>x.player_id===id);const rated=a.filter(x=>x.rating!=null);const avg=rated.length?Math.round(rated.reduce((s,x)=>s+(+x.rating||0),0)/rated.length*10)/10:'—';const goals=a.reduce((s,x)=>s+(+x.goals||0),0),assists=a.reduce((s,x)=>s+(+x.assists||0),0),conceded=a.reduce((s,x)=>s+(+x.conceded||0),0);const history=a.map(x=>{const d=days.find(d=>d.id===x.game_day_id),t=teams.find(t=>t.id===x.team_id);return {x,d,t}}).sort((u,v)=>(v.d?.game_date||'').localeCompare(u.d?.game_date||''));$('#modalContent').innerHTML=`<div class="eyebrow">ПРОФИЛЬ ИГРОКА</div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.position||'Игрок')}</p><div class="player-stats-line" style="font-size:17px"><span>⚽ <b>${goals}</b> голов</span><span>🎯 <b>${assists}</b> пасов</span><span>🔥 <b>${goals+assists}</b> Г+П</span><span>🥅 <b>${conceded}</b> пропущено</span><span>⭐ <b>${avg}</b></span><span>🏟 <b>${new Set(a.map(x=>x.game_day_id)).size}</b> игровых дней</span></div><h3 style="margin-top:22px">История выступлений</h3>${history.length?`<div style="overflow:auto"><table class="stats-table"><thead><tr><th>Дата</th><th>Команда</th><th>⚽ Забил</th><th>🎯 Пас</th><th>Г+П</th><th>🥅 Пропустил</th><th>⭐ Рейтинг</th></tr></thead><tbody>${history.map(h=>`<tr><td>${h.d?esc(fmtDate(h.d.game_date)):'—'}</td><td><span class="team-dot" style="--team:${esc(h.t?.color||'#fff')}"></span>${esc(h.t?.name||'—')}</td><td>${+h.x.goals||0}</td><td>${+h.x.assists||0}</td><td><b>${(+h.x.goals||0)+(+h.x.assists||0)}</b></td><td>${+h.x.conceded||0}</td><td>${h.x.rating??'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="note">Статистика по игровым дням пока не заполнена.</div>'}`;$('#modal').classList.remove('hidden');}
let currentPlayerSort='gp';$$('[data-player-sort]').forEach(b=>b.onclick=()=>{$$('[data-player-sort]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentPlayerSort=b.dataset.playerSort;renderPlayers();});
function renderRating(){
  const arr=players.map(p=>{const a=dayPlayers.filter(x=>x.player_id===p.id);const rated=a.filter(x=>x.rating!=null);const avg=rated.length?Math.round(rated.reduce((z,x)=>z+(+x.rating||0),0)/rated.length*10)/10:null;const s={days:new Set(a.map(x=>x.game_day_id)).size,goals:a.reduce((z,x)=>z+(+x.goals||0),0),assists:a.reduce((z,x)=>z+(+x.assists||0),0),conceded:a.reduce((z,x)=>z+(+x.conceded||0),0),rating:avg};s.gp=s.goals+s.assists;return {p,s}}).sort((a,b)=>b.s[currentSort]-a.s[currentSort]);
  $('#ratingBox').innerHTML=arr.length?`<table class="stats-table"><thead><tr><th>#</th><th>Игрок</th><th>Дни</th><th>Забил</th><th>Пас</th><th>Г+П</th><th>Пропустил</th><th>⭐ Рейтинг</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.p.name)}</b></td><td>${x.s.days}</td><td>${x.s.goals}</td><td>${x.s.assists}</td><td><b>${x.s.gp}</b></td><td>${x.s.conceded}</td><td>${x.s.rating??'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="day-card">Статистика пока не заполнена.</div>';
}

async function deletePlayer(id){
  const p=players.find(x=>x.id===id);if(!p)return;
  if(!confirm(`Удалить игрока «${p.name}» и ВСЮ его статистику?`))return;
  let r=await sb.from('game_day_players').delete().eq('player_id',id);
  if(r.error){showError(r.error);return;}
  r=await sb.from('players').delete().eq('id',id);
  if(r.error){showError(r.error);return;}
  await loadPlayers();await loadDays();renderAdminPlayers();renderPlayers();renderRating();
  if($('#teamEditors'))renderTeamEditors();
  alert('Игрок и его статистика удалены.');
}

async function deleteSavedGame(id){
  const g=games.find(x=>x.id===id); if(!g)return;
  if(!confirm('Удалить эту игру?'))return;
  const dayId=g.game_day_id;
  const r=await sb.from('games').delete().eq('id',id);
  if(r.error){showError(r.error);return;}
  await loadDays();
  if($('#modal')&&!$('#modal').classList.contains('hidden'))await openDay(dayId); else renderDays();
}

async function deleteGameDay(id){
  const d=days.find(x=>x.id===id); if(!d)return;
  if(!confirm(`Удалить игровой день ${fmtDate(d.game_date)}?\nБудут удалены команды, игры, участники и их статистика.`))return;
  let r=await sb.from('game_day_players').delete().eq('game_day_id',id);
  if(r.error){showError(r.error);return;}
  r=await sb.from('games').delete().eq('game_day_id',id);
  if(r.error){showError(r.error);return;}
  r=await sb.from('teams').delete().eq('game_day_id',id);
  if(r.error){showError(r.error);return;}
  r=await sb.from('game_days').delete().eq('id',id);
  if(r.error){showError(r.error);return;}
  await loadDays(); await loadPlayers();
  closeModal();
  if($('#adminContent'))await renderAdmin();
  alert('Игровой день полностью удалён.');
}

function renderEditGames(){
  const box=$('#editDayGames');if(!box)return;
  box.innerHTML=editDayGames.length?`<div class="game-head"><span>Команда 1</span><span>Счёт</span><span>Счёт</span><span>Команда 2</span><span></span></div>${editDayGames.map((g,i)=>`<div class="game-row edit-game-row"><select data-ed-ga="${i}">${editDayTeams.map(t=>`<option value="${t.id}" ${String(g.team_a_id)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><input aria-label="Счёт команды 1" data-ed-sa="${i}" type="number" min="0" value="${g.score_a??0}"><input aria-label="Счёт команды 2" data-ed-sb="${i}" type="number" min="0" value="${g.score_b??0}"><select data-ed-gb="${i}">${editDayTeams.map(t=>`<option value="${t.id}" ${String(g.team_b_id)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><button type="button" class="btn danger" data-ed-delgame="${i}" title="Удалить эту игру">🗑️</button></div>`).join('')}`:'<p class="note">Игр нет. Нажми «+ Добавить игру».</p>';
  $$('[data-ed-ga]').forEach(x=>x.onchange=()=>editDayGames[+x.dataset.edGa].team_a_id=+x.value);
  $$('[data-ed-gb]').forEach(x=>x.onchange=()=>editDayGames[+x.dataset.edGb].team_b_id=+x.value);
  $$('[data-ed-sa]').forEach(x=>x.oninput=()=>editDayGames[+x.dataset.edSa].score_a=Math.max(0,+x.value||0));
  $$('[data-ed-sb]').forEach(x=>x.oninput=()=>editDayGames[+x.dataset.edSb].score_b=Math.max(0,+x.value||0));
  $$('[data-ed-delgame]').forEach(x=>x.onclick=()=>{editDayGames.splice(+x.dataset.edDelgame,1);renderEditGames()});
}

function renderEditPlayers(){
  const box=$('#editDayPlayers');if(!box)return;
  const ps=dayPlayers.filter(x=>x.game_day_id===editDayId);
  box.innerHTML=`<div class="stats-help big"><span>Игрок</span><span>Команда</span><span>⚽ Забил</span><span>🎯 Пас</span><span>Г+П</span><span>🥅 Пропустил</span><span>⭐ Рейтинг</span></div>`+players.map(p=>{
    const x=ps.find(v=>v.player_id===p.id);const goals=+x?.goals||0;const assists=+x?.assists||0;
    return `<div class="player-edit-row">
      <b>${esc(p.name)}</b>
      <select data-ep-team="${p.id}"><option value="">Не участвует</option>${editDayTeams.map(t=>`<option value="${t.id}" ${x&&String(x.team_id)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
      <label class="stat-input"><span>⚽ Забил</span><input data-ep-goals="${p.id}" type="number" min="0" value="${goals}"></label>
      <label class="stat-input"><span>🎯 Пас</span><input data-ep-assists="${p.id}" type="number" min="0" value="${assists}"></label>
      <div class="gp-box"><span>Г+П</span><b data-ep-gp="${p.id}">${goals+assists}</b></div>
      <label class="stat-input"><span>🥅 Пропустил</span><input data-ep-conceded="${p.id}" type="number" min="0" value="${+x?.conceded||0}"></label>
      <label class="stat-input"><span>⭐ Рейтинг</span><input data-ep-rating="${p.id}" type="number" min="0" max="10" step="0.1" value="${x?.rating??''}" placeholder="0–10"></label>
    </div>`;
  }).join('');
  $$('[data-ep-goals]').forEach(x=>x.oninput=()=>updateGP(+x.dataset.epGoals));
  $$('[data-ep-assists]').forEach(x=>x.oninput=()=>updateGP(+x.dataset.epAssists));
}

async function openEditDay(id){
  await Promise.all([loadPlayers(),loadDays()]);
  const d=days.find(x=>x.id===id);if(!d)return;
  editDayId=id;editDayTeams=teams.filter(t=>t.game_day_id===id).map(t=>({...t}));editDayGames=games.filter(g=>g.game_day_id===id).map(g=>({...g}));
  $('#modalContent').innerHTML=`<div class="form edit-day-form"><div class="eyebrow">АДМИНКА · РЕДАКТИРОВАНИЕ</div><h2>Игровой день ${esc(fmtDate(d.game_date))}</h2><p class="note">Здесь можно изменить дату, команды, счёт игр, состав и всю статистику. После заполнения нажми «Сохранить всё».</p>
  <div class="grid"><div class="field"><label>📅 Дата игрового дня</label><input id="ed-date" type="date" value="${esc(d.game_date)}"></div><div class="field"><label>🕐 Время</label><input id="ed-time" type="time" value="${esc((d.game_time||'').slice(0,5))}"></div><div class="field"><label>📍 Место</label><input id="ed-place" value="${esc(d.place||'')}"></div></div>
  <div class="section-block"><h3>👥 Команды</h3><p class="note">Измени название и цвет команды.</p><div id="editDayTeams"></div></div>
  <div class="section-block"><h3>⚽ Игры</h3><p class="note">Здесь меняется счёт уже сыгранных матчей. Ненужную игру можно удалить.</p><div id="editDayGames"></div><button type="button" class="btn" id="editAddGame">+ Добавить игру</button></div>
  <div class="section-block"><h3>📊 Статистика игроков</h3><p class="note">У каждого игрока сначала выбери команду. Затем заполни конкретные показатели: <b>голы → пасы → пропустил → рейтинг</b>.</p>${statsLabels()}<div id="editDayPlayers"></div></div>
  <div class="save-panel"><button type="button" class="btn primary" id="saveEditDay">💾 Сохранить ВСЁ</button><span>Сохраняются дата, команды, игры, состав и статистика игроков.</span></div>
  <button type="button" class="btn" id="cancelEditDay">Отмена</button></div>`;
  $('#editDayTeams').innerHTML=editDayTeams.map(t=>`<div class="team-editor" style="margin-bottom:8px"><div class="team-editor-head"><input data-ed-team-name="${t.id}" value="${esc(t.name)}" aria-label="Название команды"><input data-ed-team-color="${t.id}" type="color" value="${esc(t.color)}" aria-label="Цвет команды"></div></div>`).join('');
  $$('[data-ed-team-name]').forEach(x=>x.oninput=()=>{const t=editDayTeams.find(t=>t.id===+x.dataset.edTeamName);if(t)t.name=x.value});
  $$('[data-ed-team-color]').forEach(x=>x.oninput=()=>{const t=editDayTeams.find(t=>t.id===+x.dataset.edTeamColor);if(t)t.color=x.value});
  renderEditGames();renderEditPlayers();
  $('#editAddGame').onclick=()=>{if(editDayTeams.length<2)return;editDayGames.push({team_a_id:editDayTeams[0].id,team_b_id:editDayTeams[1].id,score_a:0,score_b:0});renderEditGames()};
  $('#saveEditDay').onclick=saveEditDay;$('#cancelEditDay').onclick=()=>openDay(id);$('#modal').classList.remove('hidden');
}

async function saveEditDay(){
  const id=editDayId;if(!id)return;
  if(editDayGames.some(g=>!g.team_a_id||!g.team_b_id||g.team_a_id===g.team_b_id))return alert('В каждой игре должны быть две разные команды.');
  let r=await sb.from('game_days').update({game_date:$('#ed-date').value,game_time:$('#ed-time').value||null,place:$('#ed-place').value||null}).eq('id',id);if(r.error){showError(r.error);return;}
  for(const t of editDayTeams){r=await sb.from('teams').update({name:t.name,color:t.color}).eq('id',t.id);if(r.error){showError(r.error);return;}}
  r=await sb.from('games').delete().eq('game_day_id',id);if(r.error){showError(r.error);return;}
  if(editDayGames.length){const rows=editDayGames.map((g,i)=>({game_day_id:id,team_a_id:g.team_a_id,team_b_id:g.team_b_id,score_a:Math.max(0,+g.score_a||0),score_b:Math.max(0,+g.score_b||0),game_order:i+1}));r=await sb.from('games').insert(rows);if(r.error){showError(r.error);return;}}
  r=await sb.from('game_day_players').delete().eq('game_day_id',id);if(r.error){showError(r.error);return;}
  const rows=[];for(const p of players){const sel=$(`[data-ep-team="${p.id}"]`)?.value;if(!sel)continue;const rating=$(`[data-ep-rating="${p.id}"]`)?.value;rows.push({game_day_id:id,player_id:p.id,team_id:+sel,goals:Math.max(0,+($(`[data-ep-goals="${p.id}"]`)?.value||0)),assists:Math.max(0,+($(`[data-ep-assists="${p.id}"]`)?.value||0)),conceded:Math.max(0,+($(`[data-ep-conceded="${p.id}"]`)?.value||0)),rating:rating===''||rating==null?null:Math.min(10,Math.max(0,+rating))});}
  if(rows.length){r=await sb.from('game_day_players').insert(rows);if(r.error){showError(r.error);return;}}
  await loadPlayers();await loadDays();renderPlayers();renderRating();alert('Сохранено: дата, команды, игры, состав и статистика.');openDay(id);
}
loadPlayers().then(loadDays);
</script></body></html>
