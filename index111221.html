<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Будничный футбол</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090c10;--card:#11161d;--card2:#171d25;--line:#27303b;--text:#f4f6f8;--muted:#8e99a8;--accent:#ff8a1f;--good:#42c879;--danger:#ff5c5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#0b0e12ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900}.nav{display:flex;gap:5px;overflow:auto}.nav button,.tab{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}.nav button.active,.nav button:hover,.tab.active{background:var(--card2);color:#fff}.wrap{max-width:1180px;margin:auto;padding:30px 18px 80px}.page{display:none}.page.active{display:block}.hero{border:1px solid var(--line);background:linear-gradient(135deg,#151b23,#0f1319);border-radius:18px;padding:28px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--accent)}h1{font-size:40px;line-height:1.05;margin:7px 0}h2{font-size:30px;margin:5px 0 18px}h3{margin:0 0 10px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card2);color:#fff;padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:700}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}.btn.danger{background:#32171b;color:#ff9a9a}.days{display:grid;gap:14px}.day-card{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:20px;cursor:pointer}.day-head{display:flex;justify-content:space-between;gap:15px}.date{font-size:24px;font-weight:900}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.team-pill{background:var(--card2);border-radius:10px;padding:11px;border-left:5px solid var(--team)}.team-pill b{display:block}.stats-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.stats-table th,.stats-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.stats-table th{font-size:12px;color:var(--muted)}.stats-table tr:last-child td{border-bottom:0}.team-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--team);margin-right:7px}.modal{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:18px}.modal.hidden{display:none}.modalbox{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:23px;position:relative}.close{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:27px;cursor:pointer}.day-detail{display:grid;gap:20px}.team-board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team-board>div{background:var(--card2);border-radius:11px;padding:14px;border-top:5px solid var(--team)}.form{display:grid;gap:15px;background:var(--card);border:1px solid var(--line);padding:22px;border-radius:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%;background:#0c1015;border:1px solid var(--line);color:#fff;padding:11px;border-radius:8px}.team-editor{border:1px solid var(--line);border-radius:12px;padding:15px;background:#0e1319}.team-editor-head{display:grid;grid-template-columns:1fr 70px 40px;gap:8px}.color{height:42px;padding:3px!important}.players-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.player-check{background:var(--card2);padding:9px;border-radius:7px}.player-check input{width:auto!important}.games-editor{display:grid;gap:9px}.game-row{display:grid;grid-template-columns:1fr 60px 60px 1fr 40px;gap:7px;align-items:center}.login{max-width:460px;margin:30px auto}.note{font-size:13px;color:var(--muted)}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:15px}@media(max-width:800px){.hero{display:block}.teams,.team-board{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.players-list{grid-template-columns:1fr 1fr}.game-row{grid-template-columns:1fr 50px 50px 1fr 36px}}@media(max-width:500px){.top{display:block}.brand{margin-bottom:10px}.teams,.team-board,.players-list{grid-template-columns:1fr}.stats-table{font-size:12px}.stats-table th,.stats-table td{padding:9px 6px}h1{font-size:33px}}
</style></head>
<body>
<header class="top"><div class="brand">⚽ БУДНИЧНЫЙ ФУТБОЛ</div><nav class="nav"><button class="active" data-page="days">Игровые дни</button><button data-page="players">Игроки</button><button data-page="rating">Рейтинг</button><button data-page="admin">Админка</button></nav></header>
<main class="wrap">
<section id="days" class="page active"><div class="hero"><div><div class="eyebrow">ИГРОВЫЕ ДНИ</div><h1>Будничный футбол</h1><p class="muted">Каждый день — свои команды, игры и статистика.</p></div><button class="btn primary" onclick="go('admin')">+ Новый игровой день</button></div><div id="daysList" class="days"></div></section>
<section id="players" class="page"><div class="toolbar"><div><div class="eyebrow">ИГРОКИ</div><h2>Все игроки</h2></div></div><div id="playersBox"></div></section>
<section id="rating" class="page"><div class="eyebrow">ОБЩАЯ СТАТИСТИКА</div><h2>Рейтинг игроков</h2><div class="tabs"><button class="tab active" data-sort="gp">Г+П</button><button class="tab" data-sort="goals">Забил</button><button class="tab" data-sort="conceded">Пропустил</button><button class="tab" data-sort="assists">Пас</button><button class="tab" data-sort="days">Игровые дни</button></div><div id="ratingBox"></div></section>
<section id="admin" class="page"><div id="adminContent"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const SUPABASE_URL='https://hucunqgqsspwjcvozzll.supabase.co';
const SUPABASE_KEY='sb_publishable_-jsjEBT9IFPmUriZ7LDceg_lHAV-rVX';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let players=[],days=[],teams=[],games=[],dayPlayers=[],currentSort='gp',editTeams=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function go(id){$$('.page').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id)); if(id==='days')loadDays();if(id==='players')loadPlayers();if(id==='rating')loadRating();if(id==='admin')renderAdmin();}
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
async function loadPlayers(){let r=await sb.from('players').select('*').order('name');if(r.error){showError(r.error);return}players=r.data||[];renderPlayers()}
async function loadDays(){let [d,t,g,p]=await Promise.all([sb.from('game_days').select('*').order('game_date',{ascending:false}),sb.from('teams').select('*').order('sort_order'),sb.from('games').select('*').order('game_order'),sb.from('game_day_players').select('*')]);if(d.error||t.error||g.error||p.error){showError(d.error||t.error||g.error||p.error);return}days=d.data||[];teams=t.data||[];games=g.data||[];dayPlayers=p.data||[];renderDays()}
function dayName(date){return new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long'}).replace(/^./,x=>x.toUpperCase())}
function fmtDate(date){return new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}
function renderDays(){let box=$('#daysList');if(!days.length){box.innerHTML='<div class="day-card"><b>Пока нет игровых дней.</b><p class="muted">Создай первый день в админке.</p></div>';return}box.innerHTML=days.map(d=>{let ts=teams.filter(t=>t.game_day_id===d.id),gs=games.filter(g=>g.game_day_id===d.id),ps=dayPlayers.filter(p=>p.game_day_id===d.id);return `<article class="day-card" onclick="openDay(${d.id})"><div class="day-head"><div><div class="eyebrow">${esc(dayName(d.game_date))}</div><div class="date">${esc(fmtDate(d.game_date))} · ${esc(d.place||'')}</div></div><div class="muted">${esc(d.game_time||'')} · ${ts.length} команд · ${ps.length} участников</div></div><div class="teams">${ts.map(t=>{let w=0,l=0;gs.forEach(g=>{if(g.team_a_id===t.id){w+=g.score_a>g.score_b?1:0;l+=g.score_a<g.score_b?1:0}if(g.team_b_id===t.id){w+=g.score_b>g.score_a?1:0;l+=g.score_b<g.score_a?1:0}});return `<div class="team-pill" style="--team:${esc(t.color)}"><b><span class="team-dot" style="--team:${esc(t.color)}"></span>${esc(t.name)}</b><span class="muted">${w} побед · ${l} поражений</span></div>`}).join('')}</div></article>`}).join('')}
function openDay(id){let d=days.find(x=>x.id===id),ts=teams.filter(t=>t.game_day_id===id),gs=games.filter(g=>g.game_day_id===id),ps=dayPlayers.filter(p=>p.game_day_id===id);let rows=ps.map(x=>{let p=players.find(p=>p.id===x.player_id),t=ts.find(t=>t.id===x.team_id);return {...x,p,t}}).sort((a,b)=>(b.goals+b.assists)-(a.goals+a.assists));$('#modalContent').innerHTML=`<div class="day-detail"><div><div class="eyebrow">${esc(dayName(d.game_date))}</div><h2>${esc(fmtDate(d.game_date))} · ${esc(d.place||'')}</h2><div class="muted">${esc(d.game_time||'')}</div></div><div><h3>Команды</h3><div class="team-board">${ts.map(t=>{let w=0,l=0;gs.forEach(g=>{let a=t.id===g.team_a_id,b=t.id===g.team_b_id;if(a){w+=g.score_a>g.score_b?1:0;l+=g.score_a<g.score_b?1:0}if(b){w+=g.score_b>g.score_a?1:0;l+=g.score_b<g.score_a?1:0}});return `<div style="--team:${esc(t.color)}"><b>${esc(t.name)}</b><div>${w} побед · ${l} поражений</div></div>`}).join('')}</div></div><div><h3>Игры</h3>${gs.length?gs.map((g,i)=>{let a=ts.find(t=>t.id===g.team_a_id),b=ts.find(t=>t.id===g.team_b_id);return `<div class="day-card" style="cursor:default;padding:12px;margin:7px 0"><span style="color:${esc(a.color)}">${esc(a.name)}</span> <b>${g.score_a} : ${g.score_b}</b> <span style="color:${esc(b.color)}">${esc(b.name)}</span></div>`}).join(''):'<span class="muted">Игры ещё не добавлены.</span>'}</div><div><h3>Участники</h3><div style="overflow:auto"><table class="stats-table"><thead><tr><th>Игрок</th><th>Команда</th><th>Забил</th><th>Пропустил</th><th>Пас</th><th>Г+П</th><th>⭐</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.p?.name||'')}</b></td><td><span class="team-dot" style="--team:${esc(x.t?.color||'#fff')}"></span>${esc(x.t?.name||'')}</td><td>${x.goals}</td><td>${x.conceded}</td><td>${x.assists}</td><td><b>${x.goals+x.assists}</b></td><td>${x.rating??'—'}</td></tr>`).join('')}</tbody></table></div></div></div>`;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function renderPlayers(){let totals=players.map(p=>{let a=dayPlayers.filter(x=>x.player_id===p.id);return {p,g:a.reduce((s,x)=>s+x.goals,0),c:a.reduce((s,x)=>s+x.conceded,0),a:a.reduce((s,x)=>s+x.assists,0),d:new Set(a.map(x=>x.game_day_id)).size}});$('#playersBox').innerHTML=`<div class="players-list">${totals.map(x=>`<div class="day-card" style="cursor:pointer" onclick="openPlayer(${x.p.id})"><h3>${esc(x.p.name)}</h3><div class="muted">${esc(x.p.position||'Игрок')}</div><p>⚽ ${x.g} · 🥅 ${x.c} · 🎯 ${x.a}</p><b>Г+П ${x.g+x.a}</b></div>`).join('')}</div>`}
function openPlayer(id){let p=players.find(x=>x.id===id),a=dayPlayers.filter(x=>x.player_id===id);$('#modalContent').innerHTML=`<div class="eyebrow">ИГРОК</div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.position||'')}</p><table class="stats-table"><thead><tr><th>Игровых дней</th><th>Забил</th><th>Пропустил</th><th>Пас</th><th>Г+П</th></tr></thead><tbody><tr><td>${new Set(a.map(x=>x.game_day_id)).size}</td><td>${a.reduce((s,x)=>s+x.goals,0)}</td><td>${a.reduce((s,x)=>s+x.conceded,0)}</td><td>${a.reduce((s,x)=>s+x.assists,0)}</td><td><b>${a.reduce((s,x)=>s+x.goals+x.assists,0)}</b></td></tr></tbody></table>`;$('#modal').classList.remove('hidden')}
async function loadRating(){await Promise.all([loadPlayers(),loadDays()]);renderRating()}
function renderRating(){let arr=players.map(p=>{let a=dayPlayers.filter(x=>x.player_id===p.id);let s={days:new Set(a.map(x=>x.game_day_id)).size,goals:a.reduce((z,x)=>z+x.goals,0),conceded:a.reduce((z,x)=>z+x.conceded,0),assists:a.reduce((z,x)=>z+x.assists,0)};s.gp=s.goals+s.assists;return {p,s}}).sort((a,b)=>b.s[currentSort]-a.s[currentSort]);$('#ratingBox').innerHTML=`<table class="stats-table"><thead><tr><th>#</th><th>Игрок</th><th>Дни</th><th>Забил</th><th>Пропустил</th><th>Пас</th><th>Г+П</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.p.name)}</b></td><td>${x.s.days}</td><td>${x.s.goals}</td><td>${x.s.conceded}</td><td>${x.s.assists}</td><td><b>${x.s.gp}</b></td></tr>`).join('')}</tbody></table>`}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentSort=b.dataset.sort;renderRating()});
async function renderAdmin(){let {data}=await sb.from('players').select('*').order('name');players=data||[];$('#adminContent').innerHTML=`<div class="eyebrow">УПРАВЛЕНИЕ</div><h2>Новый игровой день</h2><div id="loginBox"></div><form id="dayForm" class="form hidden"><div class="grid"><div class="field"><label>Дата</label><input id="date" type="date" required></div><div class="field"><label>Время</label><input id="time" type="time"></div><div class="field"><label>Место</label><input id="place" placeholder="Металлург"></div><div class="field"><label>Количество команд</label><select id="teamCount"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></div></div><div><h3>Команды</h3><div id="teamEditors"></div></div><div><h3>Игры</h3><div id="gameEditors" class="games-editor"></div><button type="button" class="btn" id="addGame">+ Добавить игру</button></div><div><h3>Участники</h3><div id="participantEditors"></div></div><button class="btn primary">Сохранить игровой день</button></form>`;$('#date').value=new Date().toISOString().slice(0,10);let session=(await sb.auth.getSession()).data.session;if(session){$('#loginBox').innerHTML=`<p class="muted">Вы вошли как ${esc(session.user.email)}</p><button type="button" class="btn" id="logout">Выйти</button>`;$('#dayForm').classList.remove('hidden');$('#logout').onclick=async()=>{await sb.auth.signOut();renderAdmin()};}else{renderLogin();}$('#teamCount').onchange=renderTeamEditors;renderTeamEditors();$('#addGame').onclick=()=>{editGames.push({a:'',b:'',sa:0,sb:0});renderGameEditors()};$('#dayForm').onsubmit=saveDay}
let editGames=[];
function renderLogin(){let box=$('#loginBox');box.innerHTML=`<div class="form login"><h3>Вход администратора</h3><div class="field"><label>Email</label><input id="loginEmail" type="email"></div><div class="field"><label>Пароль</label><input id="loginPass" type="password"></div><button type="button" class="btn primary" id="loginBtn">Войти</button><div id="loginError" class="note"></div></div>`;$('#loginBtn').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('#loginEmail').value,password:$('#loginPass').value});if(r.error){$('#loginError').textContent=r.error.message}else renderAdmin()}}
function renderTeamEditors(){let n=+$('#teamCount').value;editTeams=Array.from({length:n},(_,i)=>editTeams[i]||{name:['Красные','Синие','Зелёные','Жёлтые'][i],color:['#E53935','#1E88E5','#43A047','#FDD835'][i]});$('#teamEditors').innerHTML=editTeams.map((t,i)=>`<div class="team-editor"><div class="team-editor-head"><input class="team-name" data-i="${i}" value="${esc(t.name)}"><input class="color" data-i="${i}" type="color" value="${esc(t.color)}"><button type="button" class="btn" data-remove="${i}">×</button></div><div class="players-list">${players.map(p=>`<label class="player-check"><input type="checkbox" data-team="${i}" data-player="${p.id}"> ${esc(p.name)}</label>`).join('')}</div></div>`).join('');$$('.team-name').forEach(x=>x.oninput=()=>editTeams[+x.dataset.i].name=x.value);$$('.color').forEach(x=>x.oninput=()=>editTeams[+x.dataset.i].color=x.value);$$('[data-remove]').forEach(x=>x.onclick=()=>{if(editTeams.length<=2)return alert('Минимум 2 команды.');editTeams.splice(+x.dataset.remove,1);$('#teamCount').value=editTeams.length;renderTeamEditors()});renderGameEditors();}
function renderGameEditors(){if(!editGames.length)editGames=[{a:'',b:'',sa:0,sb:0}];$('#gameEditors').innerHTML=editGames.map((g,i)=>`<div class="game-row"><select data-ga="${i}">${editTeams.map((t,j)=>`<option value="${j}" ${String(g.a)===String(j)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><input data-gsa="${i}" type="number" min="0" value="${g.sa}"><input data-gsb="${i}" type="number" min="0" value="${g.sb}"><select data-gb="${i}">${editTeams.map((t,j)=>`<option value="${j}" ${String(g.b)===String(j)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><button type="button" class="btn" data-delgame="${i}">×</button></div>`).join('');$$('[data-ga]').forEach(x=>x.onchange=()=>editGames[+x.dataset.ga].a=+x.value);$$('[data-gb]').forEach(x=>x.onchange=()=>editGames[+x.dataset.gb].b=+x.value);$$('[data-gsa]').forEach(x=>x.oninput=()=>editGames[+x.dataset.gsa].sa=+x.value);$$('[data-gsb]').forEach(x=>x.oninput=()=>editGames[+x.dataset.gsb].sb=+x.value);$$('[data-delgame]').forEach(x=>x.onclick=()=>{editGames.splice(+x.dataset.delgame,1);renderGameEditors()})}
async function saveDay(e){e.preventDefault();let session=(await sb.auth.getSession()).data.session;if(!session)return alert('Сначала войди.');let participants=[];for(let i=0;i<editTeams.length;i++)$$(`[data-team="${i}"]:checked`).forEach(x=>participants.push({player_id:+x.dataset.player,teamIndex:i}));if(new Set(participants.map(x=>x.player_id)).size!==participants.length)return alert('Один игрок не может быть выбран в двух командах.');let d=(await sb.from('game_days').insert({game_date:$('#date').value,game_time:$('#time').value||null,place:$('#place').value||null}).select().single());if(d.error)return showError(d.error);let created=[];for(let i=0;i<editTeams.length;i++){let r=await sb.from('teams').insert({game_day_id:d.data.id,name:editTeams[i].name,color:editTeams[i].color,sort_order:i+1}).select().single();if(r.error)return showError(r.error);created.push(r.data)}for(let i=0;i<editGames.length;i++){let g=editGames[i];if(g.a===g.b)continue;let r=await sb.from('games').insert({game_day_id:d.data.id,team_a_id:created[g.a].id,team_b_id:created[g.b].id,score_a:g.sa,score_b:g.sb,game_order:i+1});if(r.error)return showError(r.error)}if(participants.length){let rows=participants.map(x=>({game_day_id:d.data.id,player_id:x.player_id,team_id:created[x.teamIndex].id}));let r=await sb.from('game_day_players').insert(rows);if(r.error)return showError(r.error)}alert('Игровой день сохранён');editGames=[];go('days')}
function showError(e){console.error(e);alert('Ошибка: '+(e?.message||e))}
loadPlayers().then(loadDays);
</script></body></html>
